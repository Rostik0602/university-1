<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Location</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&family=Oswald:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main>
      <section class="location">
        <img
          class="location__image"
          src="images/flower.png"
          alt="Pink roses and white petals with water drops"
          width="442"
          height="459"
        />

        <h2 class="location__title">Location</h2>
        <address class="location__address">
          28 Jackson Blvd Ste 1020 Chicago<br />
          IL 60604-2340
        </address>
        <p class="location__text">
          Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris
          nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in
          reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla.
        </p>

        <h2 class="location__title location__title--follow">Follow us</h2>
        <ul class="social">
          <li class="social__item">
            <a class="social__link" href="#" aria-label="Facebook">
              <img
                class="social__icon"
                src="images/facebook.svg"
                alt=""
                width="32"
                height="32"
              />
            </a>
          </li>
          <li class="social__item">
            <a class="social__link" href="#" aria-label="Twitter">
              <img
                class="social__icon"
                src="images/twitter.svg"
                alt=""
                width="32"
                height="32"
              />
            </a>
          </li>
          <li class="social__item">
            <a class="social__link" href="#" aria-label="Instagram">
              <img
                class="social__icon"
                src="images/instagram.svg"
                alt=""
                width="32"
                height="32"
              />
            </a>
          </li>
          <li class="social__item">
            <a class="social__link" href="#" aria-label="Google Plus">
              <img
                class="social__icon"
                src="images/google-plus.svg"
                alt=""
                width="32"
                height="32"
              />
            </a>
          </li>
        </ul>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__copyright">
        &copy;2021 <a class="footer__link" href="#">Privacy policy</a>
      </p>
    </footer>
  </body>
</html>
